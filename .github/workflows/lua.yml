name: Lua checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax
        run: |
          luac5.1 -p RedridgeRecipePlanner/Catalog.lua
          luac5.1 -p RedridgeRecipePlanner/Core.lua
          luac5.1 -p RedridgeRecipePlanner/UI.lua
      - name: Catalog integrity
        run: |
          lua5.1 tests/catalog.lua
          lua5.1 tests/core.lua
          lua5.1 tests/ui.lua
